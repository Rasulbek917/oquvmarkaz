[project]
name = "oquv-markazi"
version = "1.0.0"
description = "Oʻquv markazi boshqaruv tizimi (Flask + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
]

# Vercel uchun entrypoint.
# Flask ilovasi `sayt.py` faylida, lekin bu nom Vercel'ning standart
# (app.py / index.py / main.py / server.py) nomlariga kirmaydi.
# Shu sababli qaysi fayl va qaysi o'zgaruvchi ishlatilishini aniq ko'rsatamiz.
[tool.vercel]
entrypoint = "sayt:app"
